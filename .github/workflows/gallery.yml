name: Draw product gallery sheets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow
      - run: python tools/gallery.py
      - run: |
          git config user.name "cutouts-bot"
          git config user.email "cutouts-bot@users.noreply.github.com"
          git checkout -B review
          git add -f review
          git commit -q -m "Gallery sheets"
          git push -q -f origin review
