name: Make furniture cutouts

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - limit.txt
      - scripts/**
      - .github/workflows/cutouts.yml

concurrency:
  group: cutouts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cutouts:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      U2NET_HOME: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .models
          key: rembg-isnet-general-use
      - run: pip install -q "rembg[cpu]" opencv-python-headless pillow numpy
      - run: |
          git config user.name "cutouts-bot"
          git config user.email "cutouts-bot@users.noreply.github.com"
      - run: python scripts/make_cutouts.py
